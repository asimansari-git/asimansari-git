<svg xmlns="http://www.w3.org/2000/svg" width="920" height="365" viewBox="0 0 920 365" role="img" aria-label="What I Build — Engineering Pillars with Monster Trio">
  <defs>
    <linearGradient id="buildBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#131826"/>
      <stop offset="100%" stop-color="#0c1929"/>
    </linearGradient>
    <radialGradient id="trioGlow" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridBuild" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#e6edf3" fill-opacity="0.04"/>
    </pattern>
    <clipPath id="buildClip">
      <rect x="4" y="4" width="912" height="357" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, Menlo, monospace; }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes auraPulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    .cursor { animation: blink 1.05s step-end infinite; }
    .trio-aura { animation: auraPulse 4s ease-in-out infinite; }
  </style>

  <rect width="920" height="365" fill="#0d1117"/>

  <g clip-path="url(#buildClip)">
    <rect x="4" y="4" width="912" height="357" rx="16" fill="url(#buildBg)"/>
    <rect x="4" y="4" width="912" height="357" fill="url(#gridBuild)"/>

    <!-- Left Panel: Monster Trio + Live Mini-Terminal -->
    <rect x="18" y="18" width="256" height="329" rx="12" fill="#0d1117" fill-opacity="0.72" stroke="#30363d" stroke-width="1"/>
    <circle class="trio-aura" cx="146" cy="145" r="115" fill="url(#trioGlow)"/>

    <!-- HUD Corners for Left Panel -->
    <g stroke="#22c55e" stroke-width="1.3" fill="none" stroke-opacity="0.55">
      <path d="M26 38 L26 26 L38 26"/>
      <path d="M254 26 L266 26 L266 38"/>
    </g>
    <text x="36" y="37" class="mono" font-size="9" fill="#94a3b8" letter-spacing="1">MONSTER TRIO // CORE</text>

    <!-- Monster Trio Artwork -->
    <image href="{{IMG_MONSTER_TRIO}}" x="24" y="44" width="244" height="210" preserveAspectRatio="xMidYMid meet"/>

    <!-- Mini-Terminal Showing <think>/<tool> Reasoning Tokens -->
    <rect x="28" y="262" width="236" height="74" rx="8" fill="#0b0f17" stroke="#30363d" stroke-width="1"/>
    <circle cx="40" cy="274" r="3" fill="#ef4444"/>
    <circle cx="51" cy="274" r="3" fill="#fbbf24"/>
    <circle cx="62" cy="274" r="3" fill="#22c55e"/>
    <text x="76" y="277" class="mono" font-size="8.5" fill="#64748b">nanohat-0.6b :: trace</text>
    <line x1="28" y1="284" x2="264" y2="284" stroke="#1e293b" stroke-width="1"/>
    <text x="36" y="302" class="mono" font-size="9.5" fill="#c084fc">&lt;think&gt;<tspan fill="#94a3b8">route -&gt; shell=False</tspan>&lt;/think&gt;</text>
    <text x="36" y="321" class="mono" font-size="9.5" fill="#4ade80">&lt;tool&gt;<tspan fill="#f8fafc">systemctl_status</tspan>&lt;/tool&gt;</text>
    <rect class="cursor" x="218" y="311" width="6.5" height="12" rx="1" fill="#fbbf24"/>

    <!-- Right Panel Header -->
    <text x="296" y="40" class="mono" font-size="10.5" font-weight="700" fill="#fbbf24" letter-spacing="1.2">⚡ [01] WHAT I BUILD</text>
    <text x="296" y="70" class="sans" font-size="25" font-weight="800" fill="#f8fafc">Set sail — then ship it.</text>

    <!-- Pillar 1 -->
    <g transform="translate(296, 86)">
      <rect width="602" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <rect width="3.5" height="60" rx="1.75" fill="#ef4444"/>
      <circle cx="18" cy="20" r="4" fill="#ef4444"/>
      <text x="30" y="24" class="sans" font-size="13" font-weight="700" fill="#f8fafc">SLM Fine-Tuning for Structured Reasoning</text>
      <text x="588" y="23" text-anchor="end" class="mono" font-size="9.5" font-weight="600" fill="#fca5a5">CONQUEROR'S HAKI</text>
      <text x="30" y="45" class="sans" font-size="10.9" fill="#94a3b8">Teaching non-tool-calling base models to emit &lt;think&gt; traces &amp; &lt;tool&gt; blocks without heavy wrappers.</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(296, 154)">
      <rect width="602" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <rect width="3.5" height="60" rx="1.75" fill="#22c55e"/>
      <circle cx="18" cy="20" r="4" fill="#4ade80"/>
      <text x="30" y="24" class="sans" font-size="13" font-weight="700" fill="#f8fafc">Offline OS Execution Engines</text>
      <text x="588" y="23" text-anchor="end" class="mono" font-size="9.5" font-weight="600" fill="#86efac">ZORO · ZERO-SHELL</text>
      <text x="30" y="45" class="sans" font-size="10.9" fill="#94a3b8">NanoHat OS Agent v4.1.2 (asimansari-o/nanohat): 10-tool shell=False CLI for systemd, audio &amp; GPU.</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(296, 222)">
      <rect width="602" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <rect width="3.5" height="60" rx="1.75" fill="#a855f7"/>
      <circle cx="18" cy="20" r="4" fill="#c084fc"/>
      <text x="30" y="24" class="sans" font-size="13" font-weight="700" fill="#f8fafc">Multimodal Document &amp; Receipt Ingestion</text>
      <text x="588" y="23" text-anchor="end" class="mono" font-size="9.5" font-weight="600" fill="#d8b4fe">ROBIN · PONEGLYPH PARSER</text>
      <text x="30" y="45" class="sans" font-size="10.9" fill="#94a3b8">Gemini Multimodal vision pipelines deconstructing receipts &amp; PDFs into relational SKU ledgers.</text>
    </g>

    <!-- Pillar 4 -->
    <g transform="translate(296, 290)">
      <rect width="602" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <rect width="3.5" height="60" rx="1.75" fill="#38bdf8"/>
      <circle cx="18" cy="20" r="4" fill="#38bdf8"/>
      <text x="30" y="24" class="sans" font-size="13" font-weight="700" fill="#f8fafc">Async Backend Services</text>
      <text x="588" y="23" text-anchor="end" class="mono" font-size="9.5" font-weight="600" fill="#7dd3fc">SANJI &amp; FRANKY · SHIPWRIGHT</text>
      <text x="30" y="45" class="sans" font-size="10.9" fill="#94a3b8">FastAPI, PostgreSQL, MongoDB, ChromaDB vector retrieval, plus C# / ASP.NET Core &amp; Java / Spring.</text>
    </g>
  </g>

  <rect x="4" y="4" width="912" height="357" rx="16" fill="none" stroke="#30363d" stroke-width="1.3"/>
</svg>
