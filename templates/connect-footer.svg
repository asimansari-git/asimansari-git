<svg xmlns="http://www.w3.org/2000/svg" width="920" height="250" viewBox="0 0 920 250" role="img" aria-label="Den Den Mushi Connect Footer — Asim Ansari">
  <defs>
    <linearGradient id="connectBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#131826"/>
      <stop offset="100%" stop-color="#221118"/>
    </linearGradient>
    <radialGradient id="crewGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#ef4444" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridConnect" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#e6edf3" fill-opacity="0.04"/>
    </pattern>
    <clipPath id="connectClip">
      <rect x="4" y="4" width="912" height="242" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, Menlo, monospace; }
  </style>

  <rect width="920" height="250" fill="#0d1117"/>

  <g clip-path="url(#connectClip)">
    <rect x="4" y="4" width="912" height="242" rx="16" fill="url(#connectBg)"/>
    <rect x="4" y="4" width="912" height="242" fill="url(#gridConnect)"/>

    <!-- Left Panel: Full Straw Hat Crew Atmospheric Artwork -->
    <rect x="18" y="18" width="246" height="214" rx="12" fill="#0d1117" fill-opacity="0.72" stroke="#30363d" stroke-width="1"/>
    <circle cx="141" cy="122" r="100" fill="url(#crewGlow)"/>
    <image href="{{IMG_STRAW_HAT_CREW}}" x="24" y="24" width="234" height="198" preserveAspectRatio="xMidYMid meet"/>

    <!-- Right Panel Header -->
    <text x="288" y="44" class="mono" font-size="10.5" font-weight="700" fill="#fbbf24" letter-spacing="1.2">📡 [04] DEN DEN MUSHI // CONNECT</text>
    <text x="288" y="75" class="sans" font-size="26" font-weight="800" fill="#f8fafc">Let's build something legendary.</text>

    <!-- 2x2 Contact Grid -->
    <!-- Card 1: Domain -->
    <g transform="translate(288, 94)">
      <rect width="298" height="62" rx="10" fill="#161b22" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.45"/>
      <text x="16" y="24" class="mono" font-size="9.5" font-weight="700" fill="#fbbf24" letter-spacing="1">DOMAIN // PORTFOLIO</text>
      <text x="16" y="46" class="mono" font-size="13" font-weight="700" fill="#f8fafc">asimansari.com</text>
    </g>

    <!-- Card 2: LinkedIn -->
    <g transform="translate(598, 94)">
      <rect width="302" height="62" rx="10" fill="#161b22" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.45"/>
      <text x="16" y="24" class="mono" font-size="9.5" font-weight="700" fill="#38bdf8" letter-spacing="1">LINKEDIN // NETWORK</text>
      <text x="16" y="46" class="mono" font-size="12.5" font-weight="700" fill="#f8fafc">linkedin.com/in/link-asimansari</text>
    </g>

    <!-- Card 3: Technical Articles -->
    <g transform="translate(288, 168)">
      <rect width="298" height="62" rx="10" fill="#161b22" stroke="#a855f7" stroke-width="1" stroke-opacity="0.45"/>
      <text x="16" y="24" class="mono" font-size="9.5" font-weight="700" fill="#c084fc" letter-spacing="1">TECHNICAL ARTICLES</text>
      <text x="16" y="46" class="mono" font-size="13" font-weight="700" fill="#f8fafc">asimansari.com/blogs</text>
    </g>

    <!-- Card 4: Email -->
    <g transform="translate(598, 168)">
      <rect width="302" height="62" rx="10" fill="#161b22" stroke="#ef4444" stroke-width="1" stroke-opacity="0.45"/>
      <text x="16" y="24" class="mono" font-size="9.5" font-weight="700" fill="#f87171" letter-spacing="1">EMAIL // DIRECT SIGNAL</text>
      <text x="16" y="46" class="mono" font-size="12.5" font-weight="700" fill="#f8fafc">asimansari.mail@proton.me</text>
    </g>
  </g>

  <rect x="4" y="4" width="912" height="242" rx="16" fill="none" stroke="#30363d" stroke-width="1.3"/>
</svg>
