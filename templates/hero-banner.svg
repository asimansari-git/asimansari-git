<svg xmlns="http://www.w3.org/2000/svg" width="920" height="310" viewBox="0 0 920 310" role="img" aria-label="Asim Ansari — One Piece Hero Banner">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#131826"/>
      <stop offset="100%" stop-color="#221118"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="hakiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.52"/>
      <stop offset="48%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#e6edf3" fill-opacity="0.045"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="4" y="4" width="912" height="302" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, Menlo, monospace; }
    @keyframes hakiPulse {
      0%, 100% { opacity: 0.72; transform: scale(0.96); }
      50% { opacity: 1; transform: scale(1.06); }
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0px) rotate(-6deg); }
      50% { transform: translateY(-5px) rotate(-2deg); }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .haki-aura { transform-origin: 735px 168px; animation: hakiPulse 3.8s ease-in-out infinite; }
    .compass-ring { transform-origin: 735px 168px; animation: spinSlow 28s linear infinite; }
    .hat-float { transform-origin: 410px 104px; animation: floatY 3.4s ease-in-out infinite; }
    .live-dot { animation: pulseDot 1.8s ease-in-out infinite; }
  </style>

  <!-- Outer GitHub Dark Canvas Match -->
  <rect width="920" height="310" fill="#0d1117"/>

  <!-- Card Surface -->
  <g clip-path="url(#cardClip)">
    <rect x="4" y="4" width="912" height="302" rx="16" fill="url(#heroBg)"/>
    <rect x="4" y="4" width="912" height="302" fill="url(#dotGrid)"/>

    <!-- Subtle Ambient Top-Right Straw Hat Jolly Roger Watermark -->
    <image href="{{IMG_STRAW_HAT_FLAG}}" x="822" y="16" width="76" height="68" opacity="0.24" preserveAspectRatio="xMidYMid meet"/>

    <!-- Conqueror's Haki Pulsing Aura Behind Luffy -->
    <circle class="haki-aura" cx="735" cy="168" r="140" fill="url(#hakiGlow)"/>

    <!-- Slow-Rotating Log Pose Compass Ring Behind Luffy -->
    <g class="compass-ring" opacity="0.34">
      <circle cx="735" cy="168" r="112" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="6 8"/>
      <circle cx="735" cy="168" r="96" fill="none" stroke="#ef4444" stroke-width="0.9" stroke-dasharray="2 6"/>
      <path d="M735 46 L739 58 L731 58 Z" fill="#fbbf24"/>
      <path d="M735 290 L739 278 L731 278 Z" fill="#ef4444"/>
      <path d="M613 168 L625 164 L625 172 Z" fill="#38bdf8"/>
      <path d="M857 168 L845 164 L845 172 Z" fill="#38bdf8"/>
    </g>

    <!-- Monkey D. Luffy Hero Portrait -->
    <image href="{{IMG_LUFFY_HERO}}" x="605" y="16" width="260" height="292" preserveAspectRatio="xMidYMax meet"/>

    <!-- HUD Framing Brackets Around Luffy -->
    <g stroke="#fbbf24" stroke-width="1.6" fill="none" stroke-opacity="0.6">
      <path d="M602 44 L602 28 L618 28"/>
      <path d="M856 28 L872 28 L872 44"/>
      <path d="M602 272 L602 288 L618 288"/>
      <path d="M856 288 L872 288 L872 272"/>
    </g>
    <rect x="614" y="271" width="152" height="17" rx="4" fill="#0d1117" fill-opacity="0.82" stroke="#fbbf24" stroke-width="0.6" stroke-opacity="0.4"/>
    <text x="690" y="283" text-anchor="middle" class="mono" font-size="8.6" fill="#fbbf24" letter-spacing="1">CAPTAIN // HAKI.LVL::MAX</text>

    <!-- Left Column Content -->
    <!-- Glowing Status Pill -->
    <rect x="34" y="26" width="388" height="26" rx="13" fill="#161b22" stroke="#22c55e" stroke-width="1" stroke-opacity="0.5"/>
    <circle class="live-dot" cx="50" cy="39" r="4" fill="#4ade80"/>
    <text x="62" y="43" class="mono" font-size="10.5" font-weight="600" fill="#86efac" letter-spacing="0.6">LOG POSE :: ACTIVE // AI SYSTEMS &amp; SOFTWARE ENG</text>

    <!-- Greeting -->
    <text x="36" y="79" class="sans" font-size="15" font-weight="500" fill="#94a3b8">Ahoy, I'm</text>

    <!-- Bold Gold Gradient Name + Floating Straw Hat -->
    <text x="34" y="128" class="sans" font-size="46" font-weight="900" fill="url(#goldText)" letter-spacing="1.5">ASIM ANSARI</text>
    <g class="hat-float">
      <image href="{{IMG_STRAW_HAT}}" x="378" y="76" width="60" height="52" preserveAspectRatio="xMidYMid meet"/>
    </g>

    <!-- Crimson Accent Bar + Headline Subtitle -->
    <rect x="36" y="144" width="4" height="18" rx="2" fill="#ef4444"/>
    <text x="49" y="157" class="mono" font-size="12.5" font-weight="700" fill="#f8fafc" letter-spacing="1.1">AI SYSTEMS // EDGE SLMS // LINUX &amp; BACKENDS</text>

    <!-- 2-Line Pitch -->
    <text x="36" y="185" class="sans" font-size="13.5" fill="#cbd5e1">I build small models that do real work, offline execution engines,</text>
    <text x="36" y="204" class="sans" font-size="13.5" fill="#cbd5e1">and practical backends.</text>

    <!-- 4 Glowing Stat Pills -->
    <!-- Pill 1 -->
    <g transform="translate(36, 226)">
      <rect width="126" height="54" rx="10" fill="#161b22" stroke="#fbbf24" stroke-width="1.1" stroke-opacity="0.45"/>
      <text x="12" y="25" class="mono" font-size="16" font-weight="800" fill="#fbbf24">93.98%</text>
      <text x="12" y="43" class="mono" font-size="9.2" font-weight="600" fill="#94a3b8" letter-spacing="0.6">NANOHAT ACC</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(172, 226)">
      <rect width="126" height="54" rx="10" fill="#161b22" stroke="#38bdf8" stroke-width="1.1" stroke-opacity="0.45"/>
      <text x="12" y="25" class="mono" font-size="16" font-weight="800" fill="#38bdf8">595.7ms</text>
      <text x="12" y="43" class="mono" font-size="9.2" font-weight="600" fill="#94a3b8" letter-spacing="0.6">MEDIAN P50</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(308, 226)">
      <rect width="116" height="54" rx="10" fill="#161b22" stroke="#a855f7" stroke-width="1.1" stroke-opacity="0.45"/>
      <text x="12" y="25" class="mono" font-size="16" font-weight="800" fill="#c084fc">SUB-1B</text>
      <text x="12" y="43" class="mono" font-size="9.2" font-weight="600" fill="#94a3b8" letter-spacing="0.6">EDGE SLMS</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(434, 226)">
      <rect width="136" height="54" rx="10" fill="#161b22" stroke="#22c55e" stroke-width="1.1" stroke-opacity="0.45"/>
      <text x="12" y="25" class="mono" font-size="15" font-weight="800" fill="#4ade80">shell=False</text>
      <text x="12" y="43" class="mono" font-size="9.2" font-weight="600" fill="#94a3b8" letter-spacing="0.6">ZERO-SHELL OS</text>
    </g>
  </g>

  <!-- Crisp Outer Border -->
  <rect x="4" y="4" width="912" height="302" rx="16" fill="none" stroke="url(#borderGlow)" stroke-width="1.4"/>
</svg>
